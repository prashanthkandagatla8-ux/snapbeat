name: SnapBeat iOS Build & TestFlight Deployment

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Apple Certificate and Provisioning Profile
        env:
          APPLE_CERT_CER_BASE64: ${{ secrets.APPLE_CERT_CER_BASE64 }}
          APPLE_CERT_KEY_BASE64: ${{ secrets.APPLE_CERT_KEY_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: "build_temp_keychain_password_2026"
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode certificate, private key, and provisioning profile
          echo -n "$APPLE_CERT_CER_BASE64" | base64 --decode -o $RUNNER_TEMP/cert.cer
          echo -n "$APPLE_CERT_KEY_BASE64" | base64 --decode -o $RUNNER_TEMP/key.key
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # Convert Apple DER cert to PEM
          openssl x509 -inform DER -in $RUNNER_TEMP/cert.cer -out $RUNNER_TEMP/cert.pem

          # Generate macOS-compatible PKCS12 bundle locally on macOS runner
          openssl pkcs12 -export -legacy -inkey $RUNNER_TEMP/key.key -in $RUNNER_TEMP/cert.pem -out $CERT_PATH -passout pass:"$P12_PASSWORD" || \
          openssl pkcs12 -export -inkey $RUNNER_TEMP/key.key -in $RUNNER_TEMP/cert.pem -out $CERT_PATH -passout pass:"$P12_PASSWORD"

          # Create and configure temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate into keychain
          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          # Place provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/2fed16db-5e8f-4b86-aac3-d943109b0ea0.mobileprovision
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/SnapBeat_AppStore_Profile.mobileprovision

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS IPA
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          xcrun altool --upload-app --type ios --file build/ios/ipa/*.ipa --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SnapBeat-iOS-IPA
          path: build/ios/ipa/*.ipa
          retention-days: 14