name: SnapBeat iOS Build & Package

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build SnapBeat iOS (.ipa)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Health
        run: flutter analyze

      - name: Build iOS Release App (No Codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload into Installable .IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r SnapBeat-Release-v1.0.3+4.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapBeat-iOS-IPA-v1.0.3+4
          path: SnapBeat-Release-v1.0.3+4.ipa
          retention-days: 14
